[package]
name = "supergrep"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "Local natural-language search for UTF-8 project text"
license = "Apache-2.0"

[lib]
name = "supergrep"
path = "src/lib.rs"

[[bin]]
name = "supergrep"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
clap = { version = "4.5.31", features = ["derive"] }
directories = "5.0.1"
fs2 = "0.4.3"
globset = "0.4.15"
ignore = "0.4.23"
libloading = "=0.8.9"
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["load-dynamic"] }
# `ort` rc.9's own dependency range is not exact.  Keep the generated FFI
# bindings on the same ABI/API target as the safe wrapper.
ort-sys = { version = "=2.0.0-rc.9", default-features = false }
rayon = "1.12.0"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
sha2 = "0.10.8"
thiserror = "2.0.11"
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
toml = "0.8.20"
unicode-normalization = "0.1.24"
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }

[dev-dependencies]
assert_cmd = "2.0.16"
predicates = "3.1.3"
tempfile = "3.15.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
